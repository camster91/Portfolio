<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Motomotus Colour frame fixture</title>
    <link rel="stylesheet" href="../../assets/css/global-fixes.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        .elementor-location-header { align-items: flex-start; display: flex; justify-content: space-between; padding: 10px 40px; }
        .fixture-nav { display: flex; gap: 32px; padding-top: 25px; }
        .fixture-nav a { color: #272f38; font-family: 'Zilando 2', sans-serif; text-decoration: none; }
        .fixture-page { padding-top: 10px; }
        .fixture-card { min-width: 0; }
        @media (max-width: 768px) {
            .elementor-location-header { padding: 10px 20px; }
            .fixture-nav { gap: 16px; padding-top: 18px; }
        }
    </style>
    <script>
        window.motomotusSiteConfig = { arketypeLogoUrl: '../../assets/images/arketype-logo.png' };
    </script>
    <script src="../../assets/js/global-fixes.js" defer></script>
</head>
<body class="motomotus-colour-context">
    <header class="elementor-location-header">
        <a href="/home/">
            <img src="https://motomotus.com/wp-content/uploads/2025/12/MM_Wordmark_Slate-Blue.png" alt="MOTOMOTUS" width="1280" height="625" style="display:block;width:112px;height:auto">
        </a>
        <nav class="fixture-nav" aria-label="Site"><a href="#">VFX</a><a href="#">INFO</a></nav>
    </header>
    <main class="fixture-page">
        <section class="motomotus-container motomotus-container--artist motomotus-container--filters-hidden" aria-label="Motomotus portfolio">
            <h1 class="motomotus-page-title">CHUCK</h1>
            <div class="motomotus-grid" aria-label="Portfolio projects">
                <article class="fixture-card motomotus-item"><span class="motomotus-item-inner"><span class="motomotus-media"></span><span class="motomotus-info"><span class="motomotus-title">CAN-AM</span><span class="motomotus-agency">AGENCY</span></span></span></article>
                <article class="fixture-card motomotus-item"><span class="motomotus-item-inner"><span class="motomotus-media"></span><span class="motomotus-info"><span class="motomotus-title">DRAKE</span><span class="motomotus-agency">AGENCY</span></span></span></article>
                <article class="fixture-card motomotus-item"><span class="motomotus-item-inner"><span class="motomotus-media"></span><span class="motomotus-info"><span class="motomotus-title">IBM</span><span class="motomotus-agency">AGENCY</span></span></span></article>
                <article class="fixture-card motomotus-item"><span class="motomotus-item-inner"><span class="motomotus-media"></span><span class="motomotus-info"><span class="motomotus-title">L'ORÉAL</span><span class="motomotus-agency">AGENCY</span></span></span></article>
                <article class="fixture-card motomotus-item"><span class="motomotus-item-inner"><span class="motomotus-media"></span><span class="motomotus-info"><span class="motomotus-title">POLESTAR</span><span class="motomotus-agency">AGENCY</span></span></span></article>
                <article class="fixture-card motomotus-item"><span class="motomotus-item-inner"><span class="motomotus-media"></span><span class="motomotus-info"><span class="motomotus-title">SHEERTEX</span><span class="motomotus-agency">AGENCY</span></span></span></article>
            </div>
        </section>
    </main>
</body>
</html>
